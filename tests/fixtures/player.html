<!doctype html><html lang="en"><meta charset="utf-8"><title>HoverSub test player</title><style>body{background:#182b2a;color:#faf8ef;font:20px/1.6 sans-serif;max-width:900px;margin:40px auto}.player{position:relative;background:#071010;padding:30px}video{width:100%;height:220px}#captions{font-size:30px}button{padding:12px;margin:8px}iframe{width:100%;height:150px;border:1px solid #aaa}.ytp-caption-segment{pointer-events:none;font-size:28px}</style>
<h1>HoverSub · fixture</h1><p>Enable the extension on this site, then hover: <b>dragon</b>, don't, well-known.</p>
<div class="player" id="player"><video id="video" controls muted><track id="track" kind="subtitles" srclang="en" label="English" src="/demo.vtt" default></video><div id="captions">The dragon flies over the castle.</div><button id="start">Play generated test video</button><button id="change">Change DOM subtitle</button><button id="full">Fullscreen container</button><button id="native">Native TextTrack</button></div>
<p>YouTube-like pointer-events:none caption:</p><div class="ytp-caption-segment">The dragon returns tonight.</div>
<p>Excluded inputs:</p><input value="password dragon"><div contenteditable="true">Editable dragon</div>
<h2>Cross-origin iframe (different hostname)</h2><iframe src="http://localhost:4174/frame"></iframe>
<script>const video=document.querySelector('video');let animation;document.querySelector('#start').onclick=async()=>{if(!video.srcObject){const canvas=document.createElement('canvas');canvas.width=800;canvas.height=300;const ctx=canvas.getContext('2d');const draw=()=>{ctx.fillStyle='#102e29';ctx.fillRect(0,0,800,300);ctx.fillStyle='#ddf7b1';ctx.font='32px sans-serif';ctx.fillText('HoverSub · generated fixture',60,120);ctx.fillText(new Date().toLocaleTimeString(),60,180);animation=requestAnimationFrame(draw);};draw();video.srcObject=canvas.captureStream(10);}await video.play();};document.querySelector('#change').onclick=()=>document.querySelector('#captions').textContent='Winter is coming.';document.querySelector('#full').onclick=()=>document.querySelector('#player').requestFullscreen();document.querySelector('#native').onclick=()=>{const t=video.addTextTrack('subtitles','Fixture','en');t.addCue(new VTTCue(video.currentTime,video.currentTime+60,'A dragon guards the castle.'));t.mode='showing';};window.addEventListener('pagehide',()=>{cancelAnimationFrame(animation);video.srcObject?.getTracks().forEach(t=>t.stop());});</script></html>
